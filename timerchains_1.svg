<svg width="128" height="128" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" rx="12" fill="#1a1a2e"></rect>

  <!-- Stopwatches -->
  <g stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Left stopwatch -->
    <circle cx="42" cy="48" r="20"></circle>
    <!-- crown -->
    <line x1="42" y1="22" x2="42" y2="28"></line>
    <rect x="38" y="16" width="8" height="6" rx="2"></rect>
    <!-- hand ~2 o'clock -->
    <line x1="42" y1="48" x2="52" y2="38"></line>

    <!-- Right stopwatch -->
    <circle cx="78" cy="48" r="20"></circle>
    <!-- crown -->
    <line x1="78" y1="22" x2="78" y2="28"></line>
    <rect x="74" y="16" width="8" height="6" rx="2"></rect>
    <!-- hand ~4 o'clock -->
    <line x1="78" y1="48" x2="88" y2="58"></line>

  </g>

  <!-- Chain links -->
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <rect x="6" y="86" width="18" height="10" rx="5"></rect>
    <rect x="24" y="86" width="18" height="10" rx="5"></rect>
    <rect x="42" y="86" width="18" height="10" rx="5"></rect>
    <rect x="60" y="86" width="18" height="10" rx="5"></rect>
    <rect x="78" y="86" width="18" height="10" rx="5"></rect>
    <rect x="96" y="86" width="18" height="10" rx="5"></rect>

  </g>
</svg>